<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Stitches by S — Embroidery Designs</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #111111;
    }

    body {
      overflow-x: hidden;
    }

    /* =========================================
       MAIN CONTAINER
    ========================================= */

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    h1 {
      text-align: center;
      margin: 0 0 35px;
      font-size: 32px;
      font-weight: 700;
    }

    /* =========================================
       GALLERY
    ========================================= */

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 30px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e5e5e5;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      padding-bottom: 15px;
    }

    .image-wrapper {
      width: 100%;
      overflow: hidden;
      background: #000000;
      position: relative;
    }

    .image-wrapper img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.25s ease;
      transform-origin: center center;
      cursor: zoom-in;
    }

    /* =========================================
       BUTTON AREA
    ========================================= */

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 15px 10px 0;
    }

    .controls button {
      border: none;
      border-radius: 7px;
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .view-btn {
      background: #111111;
      color: #ffffff;
    }

    .view-btn:hover {
      background: #333333;
      transform: translateY(-1px);
    }

    .zoom-btn {
      background: #eeeeee;
      color: #111111;
      font-size: 18px !important;
      min-width: 42px;
      padding: 8px 12px !important;
    }

    .zoom-btn:hover {
      background: #dddddd;
    }

    /* =========================================
       FULL SCREEN MODAL
    ========================================= */

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.97);
      overflow: hidden;

      touch-action: none;
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================================
       MODAL IMAGE AREA
    ========================================= */

    .modal-content {
      position: relative;
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      padding: 70px 20px 30px;

      touch-action: none;
    }

    .modal-content img {
      max-width: 95%;
      max-height: 90%;

      object-fit: contain;

      transform: translate3d(0, 0, 0) scale(1);

      transform-origin: center center;

      cursor: grab;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;

      touch-action: none;

      will-change: transform;
    }

    .modal-content img:active {
      cursor: grabbing;
    }

    /* =========================================
       MODAL TOP BAR
    ========================================= */

    .modal-top {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 65px;

      background: rgba(0, 0, 0, 0.88);

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 10px;

      z-index: 10000;
    }

    .modal-top button {
      border: none;
      cursor: pointer;

      border-radius: 7px;

      font-size: 15px;
      font-weight: 600;

      padding: 9px 15px;

      transition: 0.2s ease;
    }

    .modal-zoom {
      background: #ffffff;
      color: #111111;
    }

    .modal-zoom:hover {
      background: #dddddd;
    }

    .reset-btn {
      background: #777777;
      color: #ffffff;
    }

    .reset-btn:hover {
      background: #999999;
    }

    /* =========================================
       CLOSE BUTTON
    ========================================= */

    .close-btn {
      position: absolute;

      right: 18px;
      top: 12px;

      background: #e00000;
      color: #ffffff;

      font-size: 22px !important;

      width: 42px;
      height: 42px;

      padding: 0 !important;

      border-radius: 50% !important;
    }

    .close-btn:hover {
      background: #ff2222;
      transform: rotate(90deg);
    }

    /* =========================================
       ZOOM LEVEL
    ========================================= */

    .zoom-level {
      color: #ffffff;

      font-size: 14px;

      min-width: 65px;

      text-align: center;
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 700px) {

      .container {
        padding: 25px 12px 40px;
      }

      h1 {
        font-size: 25px;
        margin-bottom: 25px;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .controls {
        gap: 6px;
      }

      .controls button {
        font-size: 13px;
        padding: 8px 11px;
      }

      .modal-top {
        height: 60px;
        gap: 5px;
      }

      .modal-top button {
        padding: 8px 10px;
        font-size: 13px;
      }

      .close-btn {
        right: 8px;
        top: 9px;
      }

      .modal-content {
        padding: 65px 5px 20px;
      }

      .modal-content img {
        max-width: 100%;
        max-height: 90%;
      }
    }

  </style>
</head>


<body>

  </main>


  <!-- =========================================
       FULL SIZE MODAL
  ========================================== -->

  <div
    id="imageModal"
    class="modal"
  >


    <!-- =======================================
         TOP CONTROL BAR
    ======================================== -->

    <div class="modal-top">


      <button
        class="modal-zoom"
        onclick="changeModalZoom(0.2)"
      >
        🔍 +
      </button>


      <button
        class="modal-zoom"
        onclick="changeModalZoom(-0.2)"
      >
        🔍 −
      </button>


      <button
        class="reset-btn"
        onclick="resetModalZoom()"
      >
        Reset
      </button>


      <span
        id="zoomLevel"
        class="zoom-level"
      >
        100%
      </span>


      <button
        class="close-btn"
        onclick="closeModal()"
        aria-label="Close"
      >
        ×
      </button>


    </div>


    <!-- =======================================
         IMAGE AREA
    ======================================== -->

    <div
      id="modalContent"
      class="modal-content"
    >

      <img
        id="modalImage"
        src=""
        alt="Full size embroidery design"
        draggable="false"
      >

    </div>

  <script>


    /* =========================================
       CARD IMAGE ZOOM
    ========================================= */

    const cardZoomLevels = {};


    function zoomCard(imageId, amount) {

      const image =
        document.getElementById(imageId);


      if (!cardZoomLevels[imageId]) {

        cardZoomLevels[imageId] = 1;

      }


      cardZoomLevels[imageId] += amount;


      if (cardZoomLevels[imageId] < 1) {

        cardZoomLevels[imageId] = 1;

      }


      if (cardZoomLevels[imageId] > 2) {

        cardZoomLevels[imageId] = 2;

      }


      image.style.transform =
        "scale(" +
        cardZoomLevels[imageId] +
        ")";

    }


    /* =========================================
       MODAL ELEMENTS
    ========================================= */

    const modal =
      document.getElementById("imageModal");

    const modalImage =
      document.getElementById("modalImage");

    const modalContent =
      document.getElementById("modalContent");

    const zoomLevel =
      document.getElementById("zoomLevel");


    /* =========================================
       MODAL VARIABLES
    ========================================= */

    let modalZoom = 1;

    let translateX = 0;

    let translateY = 0;


    /* =========================================
       OPEN MODAL
    ========================================= */

    function openModal(imageSrc, title) {

      modal.classList.add("active");

      modalImage.src = imageSrc;

      modalImage.alt = title;

      modalZoom = 1;

      translateX = 0;

      translateY = 0;

      updateModalTransform();

      document.body.style.overflow = "hidden";

    }


    /* =========================================
       CLOSE MODAL
    ========================================= */

    function closeModal() {

      modal.classList.remove("active");

      modalImage.src = "";

      document.body.style.overflow = "";

      modalZoom = 1;

      translateX = 0;

      translateY = 0;

    }


    /* =========================================
       BUTTON ZOOM
    ========================================= */

    function changeModalZoom(amount) {

      modalZoom += amount;


      if (modalZoom < 0.5) {

        modalZoom = 0.5;

      }


      if (modalZoom > 5) {

        modalZoom = 5;

      }


      if (modalZoom <= 1) {

        translateX = 0;

        translateY = 0;

      }


      updateModalTransform();

    }


    /* =========================================
       UPDATE TRANSFORM
    ========================================= */

    function updateModalTransform() {

      modalImage.style.transform =
        "translate3d(" +
        translateX +
        "px, " +
        translateY +
        "px, 0) " +
        "scale(" +
        modalZoom +
        ")";


      zoomLevel.textContent =
        Math.round(modalZoom * 100) +
        "%";

    }


    /* =========================================
       RESET
    ========================================= */

    function resetModalZoom() {

      modalZoom = 1;

      translateX = 0;

      translateY = 0;

      updateModalTransform();

    }


    /* =========================================
       MOUSE WHEEL ZOOM
    ========================================= */

    modalContent.addEventListener(
      "wheel",
      function(event) {

        event.preventDefault();


        if (event.deltaY < 0) {

          changeModalZoom(0.2);

        } else {

          changeModalZoom(-0.2);

        }

      },
      {
        passive: false
      }
    );


    /* =========================================
       TOUCH / FINGER ZOOM
    ========================================= */

    let initialPinchDistance = null;

    let initialPinchZoom = 1;


    function getTouchDistance(touch1, touch2) {

      const dx =
        touch2.clientX -
        touch1.clientX;

      const dy =
        touch2.clientY -
        touch1.clientY;


      return Math.sqrt(
        dx * dx +
        dy * dy
      );

    }


    /* =========================================
       TOUCH START
    ========================================= */

    modalContent.addEventListener(
      "touchstart",
      function(event) {

        event.preventDefault();


        /* TWO FINGERS */

        if (event.touches.length === 2) {

          initialPinchDistance =
            getTouchDistance(
              event.touches[0],
              event.touches[1]
            );


          initialPinchZoom =
            modalZoom;

          return;

        }


        /* ONE FINGER */

        if (event.touches.length === 1) {

          startDrag(
            event.touches[0]
          );

        }

      },
      {
        passive: false
      }
    );


    /* =========================================
       TOUCH MOVE
    ========================================= */

    modalContent.addEventListener(
      "touchmove",
      function(event) {

        event.preventDefault();


        /* ==============================
           TWO-FINGER PINCH
        =============================== */

        if (
          event.touches.length === 2 &&
          initialPinchDistance !== null
        ) {

          const currentDistance =
            getTouchDistance(
              event.touches[0],
              event.touches[1]
            );


          const scale =
            currentDistance /
            initialPinchDistance;


          modalZoom =
            initialPinchZoom *
            scale;


          if (modalZoom < 0.5) {

            modalZoom = 0.5;

          }


          if (modalZoom > 5) {

            modalZoom = 5;

          }


          updateModalTransform();


          return;

        }


        /* ==============================
           ONE-FINGER DRAG
        =============================== */

        if (
          event.touches.length === 1 &&
          modalZoom > 1
        ) {

          moveDrag(
            event.touches[0]
          );

        }

      },
      {
        passive: false
      }
    );


    /* =========================================
       TOUCH END
    ========================================= */

    modalContent.addEventListener(
      "touchend",
      function(event) {

        if (event.touches.length < 2) {

          initialPinchDistance = null;

        }


        if (event.touches.length === 0) {

          endDrag();

        }

      },
      {
        passive: false
      }
    );


    /* =========================================
       DRAG VARIABLES
    ========================================= */

    let isDragging = false;

    let dragStartX = 0;

    let dragStartY = 0;

    let startTranslateX = 0;

    let startTranslateY = 0;


    /* =========================================
       START DRAG
    ========================================= */

    function startDrag(touch) {

      if (modalZoom <= 1) {

        return;

      }


      isDragging = true;


      dragStartX =
        touch.clientX;

      dragStartY =
        touch.clientY;


      startTranslateX =
        translateX;

      startTranslateY =
        translateY;

    }


    /* =========================================
       MOVE DRAG
    ========================================= */

    function moveDrag(touch) {

      if (!isDragging) {

        return;

      }


      const movementX =
        touch.clientX -
        dragStartX;


      const movementY =
        touch.clientY -
        dragStartY;


      translateX =
        startTranslateX +
        movementX;


      translateY =
        startTranslateY +
        movementY;


      updateModalTransform();

    }


    /* =========================================
       END DRAG
    ========================================= */

    function endDrag() {

      isDragging = false;

    }


    /* =========================================
       MOUSE DRAG
    ========================================= */

    let mouseDragging = false;

    let mouseStartX = 0;

    let mouseStartY = 0;

    let mouseStartTranslateX = 0;

    let mouseStartTranslateY = 0;


    modalImage.addEventListener(
      "mousedown",
      function(event) {

        if (modalZoom <= 1) {

          return;

        }


        event.preventDefault();


        mouseDragging = true;


        mouseStartX =
          event.clientX;

        mouseStartY =
          event.clientY;


        mouseStartTranslateX =
          translateX;

        mouseStartTranslateY =
          translateY;

      }
    );


    document.addEventListener(
      "mousemove",
      function(event) {

        if (!mouseDragging) {

          return;

        }


        translateX =
          mouseStartTranslateX +
          event.clientX -
          mouseStartX;


        translateY =
          mouseStartTranslateY +
          event.clientY -
          mouseStartY;


        updateModalTransform();

      }
    );


    document.addEventListener(
      "mouseup",
      function() {

        mouseDragging = false;

      }
    );


    /* =========================================
       KEYBOARD CONTROLS
    ========================================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (!modal.classList.contains("active")) {

          return;

        }


        /* ESC */

        if (event.key === "Escape") {

          closeModal();

        }


        /* PLUS */

        if (event.key === "+") {

          changeModalZoom(0.2);

        }


        if (event.key === "=") {

          changeModalZoom(0.2);

        }


        /* MINUS */

        if (event.key === "-") {

          changeModalZoom(-0.2);

        }


        /* RESET */

        if (event.key === "0") {

          resetModalZoom();

        }

      }
    );


    /* =========================================
       CLICK BLACK BACKGROUND TO CLOSE
    ========================================= */

    modal.addEventListener(
      "click",
      function(event) {

        if (
          event.target === modal ||
          event.target === modalContent
        ) {

          closeModal();

        }

      }
    );

  </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stitches by S — Embroidery Designs</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #111111;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    h1 {
      text-align: center;
      margin: 0 0 35px;
      font-size: 32px;
      font-weight: 700;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 30px;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #e5e5e5;
      background: #fff;
    }

    @media (max-width: 700px) {
      .container {
        padding: 25px 12px 40px;
      }

      h1 {
        font-size: 25px;
        margin-bottom: 25px;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Stitches by S — Embroidery Designs</h1>

    <div class="gallery">
      <img src="777.png" alt="Stitches by S Embroidery Design 777">
      <img src="778.png" alt="Stitches by S Embroidery Design 778">
      <img src="779.png" alt="Stitches by S Embroidery Design 779">
      <img src="780.png" alt="Stitches by S Embroidery Design 780">
      <img src="781.png" alt="Stitches by S Embroidery Design 781">
      <img src="782.png" alt="Stitches by S Embroidery Design 782">
    </div>
  </main>
</body>
</html>

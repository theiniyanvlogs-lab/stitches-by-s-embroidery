<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stitches by S — Embroidery Designs</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #fff; font-family: Arial, Helvetica, sans-serif; color: #111; }
    body { overflow-x: hidden; }
    .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px 60px; }
    h1 { text-align: center; margin: 0 0 35px; font-size: 32px; font-weight: 700; }
    .gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #e5e5e5; box-shadow: 0 4px 15px rgba(0,0,0,.08); padding-bottom: 15px; }
    .image-wrapper { width: 100%; overflow: hidden; background: #000; position: relative; }
    .image-wrapper img { display: block; width: 100%; height: auto; transition: transform .25s ease; transform-origin: center center; cursor: zoom-in; }
    .controls { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; padding: 15px 10px 0; }
    .controls button { border: none; border-radius: 7px; padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s ease; }
    .view-btn { background: #111; color: #fff; }
    .view-btn:hover { background: #333; transform: translateY(-1px); }
    .zoom-btn { background: #eee; color: #111; font-size: 18px !important; min-width: 42px; padding: 8px 12px !important; }
    .zoom-btn:hover { background: #ddd; }
    .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,.97); overflow: hidden; touch-action: none; }
    .modal.active { display: flex; align-items: center; justify-content: center; }
    .modal-content { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 70px 20px 30px; touch-action: none; }
    .modal-content img { max-width: 95%; max-height: 90%; object-fit: contain; transform: translate3d(0,0,0) scale(1); transform-origin: center center; cursor: grab; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; touch-action: none; will-change: transform; }
    .modal-content img:active { cursor: grabbing; }
    .modal-top { position: absolute; top: 0; left: 0; width: 100%; height: 65px; background: rgba(0,0,0,.88); display: flex; justify-content: center; align-items: center; gap: 10px; z-index: 10000; }
    .modal-top button { border: none; cursor: pointer; border-radius: 7px; font-size: 15px; font-weight: 600; padding: 9px 15px; transition: .2s ease; }
    .modal-zoom { background: #fff; color: #111; }
    .modal-zoom:hover { background: #ddd; }
    .reset-btn { background: #777; color: #fff; }
    .reset-btn:hover { background: #999; }
    .close-btn { position: absolute; right: 18px; top: 12px; background: #e00000; color: #fff; font-size: 22px !important; width: 42px; height: 42px; padding: 0 !important; border-radius: 50% !important; }
    .close-btn:hover { background: #f22; transform: rotate(90deg); }
    .zoom-level { color: #fff; font-size: 14px; min-width: 65px; text-align: center; }
    @media (max-width: 700px) {
      .container { padding: 25px 12px 40px; }
      h1 { font-size: 25px; margin-bottom: 25px; }
      .gallery { grid-template-columns: 1fr; gap: 20px; }
      .controls { gap: 6px; }
      .controls button { font-size: 13px; padding: 8px 11px; }
      .modal-top { height: 60px; gap: 5px; }
      .modal-top button { padding: 8px 10px; font-size: 13px; }
      .close-btn { right: 8px; top: 9px; }
      .modal-content { padding: 65px 5px 20px; }
      .modal-content img { max-width: 100%; max-height: 90%; }
    }
  </style>
</head>
<body>
<main class="container">
  <h1>Stitches by S — Embroidery Designs</h1>
  <div class="gallery" id="gallery"></div>
</main>

<div id="imageModal" class="modal">
  <div class="modal-top">
    <button class="modal-zoom" onclick="changeModalZoom(.2)">🔍 +</button>
    <button class="modal-zoom" onclick="changeModalZoom(-.2)">🔍 −</button>
    <button class="reset-btn" onclick="resetModalZoom()">Reset</button>
    <span id="zoomLevel" class="zoom-level">100%</span>
    <button class="close-btn" onclick="closeModal()" aria-label="Close">×</button>
  </div>
  <div id="modalContent" class="modal-content">
    <img id="modalImage" src="" alt="Full size embroidery design" draggable="false">
  </div>
</div>

<script>
  const gallery = document.getElementById("gallery");

  for (let number = 777; number <= 814; number++) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="image-wrapper">
        <img id="image-${number}" src="${number}.png"
             alt="Stitches by S Embroidery Design ${number}">
      </div>
      <div class="controls">
        <button class="view-btn"
          onclick="openModal('${number}.png', 'Stitches by S — SBEMB-${number}')">
          View Full Size
        </button>
        <button class="zoom-btn" onclick="zoomCard('image-${number}', .1)">+</button>
        <button class="zoom-btn" onclick="zoomCard('image-${number}', -.1)">−</button>
      </div>`;
    gallery.appendChild(card);
  }

  const cardZoomLevels = {};

  function zoomCard(imageId, amount) {
    const image = document.getElementById(imageId);
    if (!cardZoomLevels[imageId]) cardZoomLevels[imageId] = 1;
    cardZoomLevels[imageId] += amount;
    cardZoomLevels[imageId] = Math.min(2, Math.max(1, cardZoomLevels[imageId]));
    image.style.transform = `scale(${cardZoomLevels[imageId]})`;
  }

  const modal = document.getElementById("imageModal");
  const modalImage = document.getElementById("modalImage");
  const modalContent = document.getElementById("modalContent");
  const zoomLevel = document.getElementById("zoomLevel");

  let modalZoom = 1, translateX = 0, translateY = 0;

  function openModal(imageSrc, title) {
    modal.classList.add("active");
    modalImage.src = imageSrc;
    modalImage.alt = title;
    modalZoom = 1;
    translateX = 0;
    translateY = 0;
    updateModalTransform();
    document.body.style.overflow = "hidden";
  }

  function closeModal() {
    modal.classList.remove("active");
    modalImage.src = "";
    document.body.style.overflow = "";
    modalZoom = 1;
    translateX = 0;
    translateY = 0;
  }

  function changeModalZoom(amount) {
    modalZoom += amount;
    modalZoom = Math.min(5, Math.max(.5, modalZoom));
    if (modalZoom <= 1) {
      translateX = 0;
      translateY = 0;
    }
    updateModalTransform();
  }

  function updateModalTransform() {
    modalImage.style.transform =
      `translate3d(${translateX}px, ${translateY}px, 0) scale(${modalZoom})`;
    zoomLevel.textContent = `${Math.round(modalZoom * 100)}%`;
  }

  function resetModalZoom() {
    modalZoom = 1;
    translateX = 0;
    translateY = 0;
    updateModalTransform();
  }

  modalContent.addEventListener("wheel", event => {
    event.preventDefault();
    changeModalZoom(event.deltaY < 0 ? .2 : -.2);
  }, { passive: false });

  let initialPinchDistance = null;
  let initialPinchZoom = 1;

  function getTouchDistance(a, b) {
    const dx = b.clientX - a.clientX;
    const dy = b.clientY - a.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  modalContent.addEventListener("touchstart", event => {
    event.preventDefault();

    if (event.touches.length === 2) {
      initialPinchDistance = getTouchDistance(event.touches[0], event.touches[1]);
      initialPinchZoom = modalZoom;
      endDrag();
      return;
    }

    if (event.touches.length === 1) startDrag(event.touches[0]);
  }, { passive: false });

  modalContent.addEventListener("touchmove", event => {
    event.preventDefault();

    if (event.touches.length === 2 && initialPinchDistance !== null) {
      const currentDistance = getTouchDistance(event.touches[0], event.touches[1]);
      modalZoom = initialPinchZoom * (currentDistance / initialPinchDistance);
      modalZoom = Math.min(5, Math.max(.5, modalZoom));
      if (modalZoom <= 1) {
        translateX = 0;
        translateY = 0;
      }
      updateModalTransform();
      return;
    }

    if (event.touches.length === 1 && modalZoom > 1) {
      moveDrag(event.touches[0]);
    }
  }, { passive: false });

  modalContent.addEventListener("touchend", event => {
    if (event.touches.length < 2) initialPinchDistance = null;
    if (event.touches.length === 0) endDrag();
  }, { passive: false });

  let isDragging = false;
  let dragStartX = 0, dragStartY = 0;
  let startTranslateX = 0, startTranslateY = 0;

  function startDrag(touch) {
    if (modalZoom <= 1) return;
    isDragging = true;
    dragStartX = touch.clientX;
    dragStartY = touch.clientY;
    startTranslateX = translateX;
    startTranslateY = translateY;
  }

  function moveDrag(touch) {
    if (!isDragging) return;
    translateX = startTranslateX + touch.clientX - dragStartX;
    translateY = startTranslateY + touch.clientY - dragStartY;
    updateModalTransform();
  }

  function endDrag() {
    isDragging = false;
  }

  let mouseDragging = false;
  let mouseStartX = 0, mouseStartY = 0;
  let mouseStartTranslateX = 0, mouseStartTranslateY = 0;

  modalImage.addEventListener("mousedown", event => {
    if (modalZoom <= 1) return;
    event.preventDefault();
    mouseDragging = true;
    mouseStartX = event.clientX;
    mouseStartY = event.clientY;
    mouseStartTranslateX = translateX;
    mouseStartTranslateY = translateY;
  });

  document.addEventListener("mousemove", event => {
    if (!mouseDragging) return;
    translateX = mouseStartTranslateX + event.clientX - mouseStartX;
    translateY = mouseStartTranslateY + event.clientY - mouseStartY;
    updateModalTransform();
  });

  document.addEventListener("mouseup", () => {
    mouseDragging = false;
  });

  document.addEventListener("keydown", event => {
    if (!modal.classList.contains("active")) return;

    if (event.key === "Escape") closeModal();
    if (event.key === "+" || event.key === "=") changeModalZoom(.2);
    if (event.key === "-") changeModalZoom(-.2);
    if (event.key === "0") resetModalZoom();
  });

  modal.addEventListener("click", event => {
    if (event.target === modal || event.target === modalContent) closeModal();
  });
</script>
</body>
</html>
